<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>보컬 노트 Studio - Vocal Practice</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --purple: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* 헤더 */
    header { background-color: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 0; z-index: 50; backdrop-filter: blur(8px); }
    .header-content { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.15rem; font-weight: 800; display: flex; align-items: center; gap: 8px; color: #818cf8; }
    .header-badges { display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 0.75rem; background: #064e3b; color: #6ee7b7; padding: 4px 10px; border-radius: 9999px; border: 1px solid #059669; font-weight: 600; }
    
    /* 메인 컨테이너 */
    main { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    
    /* 카테고리 탭 & 검색 */
    .filter-bar { display: flex; flex-direction: column; gap: 10px; }
    .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .cat-btn { padding: 8px 16px; border-radius: 9999px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub); font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .search-box { width: 100%; position: relative; }
    .search-input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); padding: 10px 14px; border-radius: 12px; color: #fff; font-size: 0.9rem; outline: none; }
    .search-input:focus { border-color: var(--primary); }

    /* 곡 선택 가로 스크롤 카드 */
    .songs-shelf { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 8px; -webkit-overflow-scrolling: touch; }
    .song-pill { background: var(--card-bg); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 130px; flex-shrink: 0; transition: 0.2s; }
    .song-pill:hover, .song-pill.active { border-color: #818cf8; background: #1e1e38; }
    .song-pill.active { box-shadow: 0 0 0 2px #4f46e5; }
    .song-pill .title { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .song-pill .artist { font-size: 0.75rem; color: var(--text-sub); }

    /* 활성 곡 정보 카드 */
    .song-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .song-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
    .song-main-info h2 { font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .song-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.8rem; color: var(--text-sub); }
    .meta-tag { background: #334155; padding: 2px 8px; border-radius: 6px; }

    /* 오디오 & 구글 드라이브 섹션 */
    .audio-panel { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .drive-input-row { display: flex; gap: 8px; }
    .drive-input { flex: 1; background: #1e293b; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 0.85rem; }
    .btn { background: var(--primary); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }
    .pitch-bar { display: flex; align-items: center; justify-content: space-between; background: #1e293b; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; }
    .pitch-btns { display: flex; align-items: center; gap: 6px; }
    .pitch-btn { background: #334155; border: 1px solid #475569; color: #fff; width: 32px; height: 30px; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    .pitch-val { font-weight: 700; color: #38bdf8; min-width: 48px; text-align: center; }

    /* 가사 모드 탭 */
    .view-mode-tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .mode-btn { background: transparent; border: none; color: var(--text-sub); font-size: 0.82rem; font-weight: 700; padding: 6px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
    .mode-btn.active { background: #312e81; color: #a5b4fc; }

    /* 툴바 (숨쉬기 체크, 형광펜) */
    .tools-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #0f172a; padding: 8px 12px; border-radius: 10px; border: 1px solid #334155; }
    .tool-btn { background: #1e293b; border: 1px solid #334155; color: #fff; font-size: 0.8rem; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .tool-btn.active { border-color: #818cf8; background: #2e1065; color: #e9d5ff; font-weight: 700; }

    /* 가사 영역 */
    .lyrics-sheet { background: #ffffff; color: #0f172a; border-radius: 14px; padding: 24px 16px; line-height: 1.8; user-select: text; }
    .stanza { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px dashed #e2e8f0; }
    .stanza:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .line-group { margin-bottom: 12px; }
    .line-orig { font-size: 1.15rem; font-weight: 800; color: #000; letter-spacing: -0.02em; }
    .line-pron { font-size: 0.95rem; font-weight: 600; color: #475569; margin-top: 2px; }
    .line-trans { font-size: 0.9rem; font-weight: 600; color: #7c3aed; margin-top: 2px; }
    
    /* 호흡 및 발성 마크 */
    .breath-mark { display: inline-block; color: #dc2626; font-weight: 900; font-size: 1.05rem; margin: 0 3px; cursor: pointer; transform: translateY(-2px); }
    .hl-yellow { background-color: #fef08a; padding: 2px 2px; border-radius: 3px; }
    .hl-green { background-color: #bbf7d0; padding: 2px 2px; border-radius: 3px; }
    .hl-pink { background-color: #fbcfe8; padding: 2px 2px; border-radius: 3px; }
    .word-click { cursor: pointer; padding: 0 1px; border-radius: 2px; }
    .word-click:hover { background-color: #f1f5f9; }

    /* 보컬 팁 배너 */
    .tip-box { background: #1e1b4b; border-left: 4px solid #818cf8; padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; color: #c7d2fe; }

    /* 구글 드라이브 내장 플레이어 프레임 */
    .drive-iframe-wrap { width: 100%; border-radius: 8px; overflow: hidden; height: 60px; background: #000; }
    .drive-iframe-wrap iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="logo">🎤 보컬 노트 Studio</div>
      <div class="header-badges">
        <span class="status-badge" id="saveBadge">☁️ 자동 저장 켜짐</span>
      </div>
    </div>
  </header>

  <main>
    <!-- 검색 및 카테고리 -->
    <div class="filter-bar">
      <div class="category-tabs">
        <button class="cat-btn active" onclick="setCategory('ALL')">전체 곡</button>
        <button class="cat-btn" onclick="setCategory('J-POP')">J-POP (미세스 그린 애플)</button>
        <button class="cat-btn" onclick="setCategory('K-POP')">K-POP</button>
        <button class="cat-btn" onclick="setCategory('POP')">POP</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="곡 제목, 가수, 가사 검색..." oninput="handleSearch()">
      </div>
    </div>

    <!-- 곡 목록 카드 스크롤 -->
    <div class="songs-shelf" id="songsShelf"></div>

    <!-- 현재 곡 스튜디오 카드 -->
    <div class="song-card" id="songCard">
      <div class="song-header">
        <div class="song-main-info">
          <h2 id="cardTitle">곡 제목</h2>
          <div class="song-meta">
            <span class="meta-tag" id="cardArtist">가수</span>
            <span class="meta-tag" id="cardKey">원키</span>
            <span class="meta-tag" id="cardTJ">TJ / KY 번호</span>
          </div>
        </div>
      </div>

      <!-- 오디오 & 구글 드라이브 플레이어 섹션 -->
      <div class="audio-panel">
        <div style="font-size: 0.8rem; color: #94a3b8; font-weight: 600;">☁️ 구글 드라이브 음원 또는 기기 파일</div>
        <div class="drive-input-row">
          <input type="text" id="driveUrlInput" class="drive-input" placeholder="구글 드라이브 공유 링크 (권한: 링크가 있는 모든 사용자)">
          <button class="btn" onclick="saveDriveLink()">연동</button>
        </div>
        <div id="drivePlayerWrap" style="display:none;" class="drive-iframe-wrap">
          <iframe id="driveFrame" src=""></iframe>
        </div>
        
        <!-- 내 파일 직접 재생 & 피치 제어 (±6키) -->
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px;">
          <label class="btn btn-secondary" style="font-size:0.75rem; padding:6px 10px; cursor:pointer;">
            📁 폰/PC 오디오 파일 재생
            <input type="file" id="localFileInput" accept="audio/*" style="display:none;" onchange="loadLocalFile(this)">
          </label>
          <audio id="nativeAudio" controls style="flex:1; min-width: 200px; height: 36px; display:none;"></audio>
        </div>

        <div class="pitch-bar">
          <span>음원 피치 키 조절:</span>
          <div class="pitch-btns">
            <button class="pitch-btn" onclick="changePitch(-1)">♭</button>
            <span class="pitch-val" id="pitchValText">원키 (0)</span>
            <button class="pitch-btn" onclick="changePitch(1)">♯</button>
            <button class="btn-secondary" style="padding:4px 8px; font-size:0.75rem; border-radius:4px; margin-left:6px;" onclick="resetPitch()">초기화</button>
          </div>
        </div>
      </div>

      <!-- 보컬 팁 -->
      <div class="tip-box" id="cardVocalTip"></div>

      <!-- 가사 보기 모드 탭 (J-POP 전용 후리가나 포함) -->
      <div class="view-mode-tabs" id="viewModeTabs">
        <button class="mode-btn active" onclick="setViewMode('3tier')">기본 3단 (원문+발음+해석)</button>
        <button class="mode-btn" id="furiBtn" onclick="setViewMode('furi')">あ 후리가나(히라가나)만</button>
        <button class="mode-btn" id="pronBtn" onclick="setViewMode('pron')">가 한국어 발음만</button>
      </div>

      <!-- 도구 툴바 -->
      <div class="tools-bar">
        <span style="font-size:0.8rem; color:#94a3b8; font-weight:600;">체크 도구:</span>
        <button class="tool-btn active" id="toolBreath" onclick="setTool('breath')">∨ 숨쉬는 곳 체크</button>
        <button class="tool-btn" id="toolHlYellow" onclick="setTool('hl-yellow')">🟨 노랑 형광펜</button>
        <button class="tool-btn" id="toolHlGreen" onclick="setTool('hl-green')">🟩 초록 형광펜</button>
        <button class="tool-btn" id="toolHlPink" onclick="setTool('hl-pink')">🌸 분홍 형광펜</button>
        <button class="tool-btn" id="toolEraser" onclick="setTool('eraser')">🧹 지우개</button>
      </div>

      <!-- 가사 악보 종이 -->
      <div class="lyrics-sheet" id="lyricsSheet"></div>
    </div>
  </main>

            orig: "ああ なんて素敵な日だ",
            furi: "ああ なんて すてきな ひだ",
            pron: "아아 난테 스테키나 히다",
            trans: "아아 이 얼마나 멋진 날인가"
          },
          {
            orig: "誰かを愛せてる日だ",
            furi: "だれかを あいせてる ひだ",
            pron: "다레카오 아이세테루 히다",
            trans: "누군가를 사랑하고 있는 날이다"
          }
        ]
      }
    ];

    // 상태 관리
    let songs = [];
    let currentCategory = 'ALL';
    let currentSongId = 'mga-lilac';
    let currentViewMode = '3tier'; // '3tier', 'furi', 'pron'
    let currentTool = 'breath'; // 'breath', 'hl-yellow', 'hl-green', 'hl-pink', 'eraser'
    let currentPitch = 0; // -6 to +6

    // 로컬 스토리지 안전 불러오기
    function initData() {
      try {
        const saved = localStorage.getItem('vocal_note_songs_v2');
        if (saved) {
          songs = JSON.parse(saved);
        } else {
          songs = DEFAULT_SONGS;
          saveData();
        }
      } catch (e) {
        songs = DEFAULT_SONGS;
      }
      renderSongShelf();
      renderActiveSong();
    }

    function saveData() {
      try {
        localStorage.setItem('vocal_note_songs_v2', JSON.stringify(songs));
        const badge = document.getElementById('saveBadge');
        if (badge) {
          badge.innerText = '☁️ 저장 완료 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
      } catch (e) {}
    }

    function getActiveSong() {
      return songs.find(s => s.id === currentSongId) || songs[0];
    }

    // 카테고리 & 검색
    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'ALL' && btn.innerText.includes('전체')));
      });
      renderSongShelf();
    }

    function handleSearch() {
      renderSongShelf();
    }

    function renderSongShelf() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const shelf = document.getElementById('songsShelf');
      shelf.innerHTML = '';

      const filtered = songs.filter(s => {
        const matchCat = (currentCategory === 'ALL') || (s.category === currentCategory);
        const matchQ = !q || s.title.toLowerCase().includes(q) || s.artist.toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      filtered.forEach(s => {
        const pill = document.createElement('div');
        pill.className = `song-pill ${s.id === currentSongId ? 'active' : ''}`;
        pill.onclick = () => selectSong(s.id);
        pill.innerHTML = `<span class="title">${s.title}</span><span class="artist">${s.artist}</span>`;
        shelf.appendChild(pill);
      });
    }

    function selectSong(id) {
      currentSongId = id;
      renderSongShelf();
      renderActiveSong();
    }

    // 활성 곡 화면 렌더링
    function renderActiveSong() {
      const song = getActiveSong();
      if (!song) return;

      document.getElementById('cardTitle').innerText = song.title;
      document.getElementById('cardArtist').innerText = song.artist;
      document.getElementById('cardKey').innerText = song.keyInfo || '원키';
      document.getElementById('cardTJ').innerText = song.tjKy || '';
      document.getElementById('cardVocalTip').innerText = song.vocalTip || '호흡과 발음을 체크하며 연습해보세요.';
      document.getElementById('driveUrlInput').value = song.driveUrl || '';

      // J-POP 여부에 따라 후리가나 탭 노출
      const isJpop = song.category === 'J-POP';
      document.getElementById('furiBtn').style.display = isJpop ? 'inline-block' : 'none';

      updateDrivePlayer(song.driveUrl);
      renderLyrics();
    }

    // 가사 렌더링 (호흡 표시 및 형광펜 유지)
    function renderLyrics() {
      const song = getActiveSong();
      const sheet = document.getElementById('lyricsSheet');
      sheet.innerHTML = '';

      song.stanzas.forEach((st, sIdx) => {
        const stanzaEl = document.createElement('div');
        stanzaEl.className = 'stanza';

        let html = '';

        if (currentViewMode === '3tier') {
          html += `<div class="line-group">
            <div class="line-orig">${formatTextWithMarks(st.orig, sIdx, 'orig')}</div>
            <div class="line-pron">${formatTextWithMarks(st.pron, sIdx, 'pron')}</div>
            <div class="line-trans">${st.trans || ''}</div>
          </div>`;
        } else if (currentViewMode === 'furi') {
          html += `<div class="line-group">
            <div class="line-orig" style="color:#4f46e5;">${formatTextWithMarks(st.furi || st.orig, sIdx, 'furi')}</div>
            <div class="line-trans">${st.trans || ''}</div>
          </div>`;
        } else if (currentViewMode === 'pron') {
          html += `<div class="line-group">
            <div class="line-orig" style="color:#0f172a; font-size:1.3rem;">${formatTextWithMarks(st.pron, sIdx, 'pron')}</div>
            <div class="line-trans">${st.trans || ''}</div>
          </div>`;
        }

        stanzaEl.innerHTML = html;
        sheet.appendChild(stanzaEl);
      });
    }

    // 호흡표시(∨) 및 글자 클릭 인터랙션
    function formatTextWithMarks(text, sIdx, type) {
      if (!text) return '';
      const song = getActiveSong();
      const key = `${sIdx}_${type}`;
      const breaths = (song.breaths && song.breaths[key]) || [];
      const highlights = (song.highlights && song.highlights[key]) || {};

      let result = '';
      const chars = Array.from(text);

      chars.forEach((ch, idx) => {
        const hlClass = highlights[idx] ? `hl-${highlights[idx]}` : '';
        result += `<span class="word-click ${hlClass}" onclick="handleWordClick(${sIdx}, '${type}', ${idx})">${ch}</span>`;
        if (breaths.includes(idx)) {
          result += `<span class="breath-mark" onclick="removeBreath(${sIdx}, '${type}', ${idx}, event)">∨</span>`;
        }
      });
      return result;
    }

    // 글자 터치 시 도구(호흡 체크 / 형광펜 / 지우개) 적용
    function handleWordClick(sIdx, type, chIdx) {
      const song = getActiveSong();
      if (!song.breaths) song.breaths = {};
      if (!song.highlights) song.highlights = {};
      const key = `${sIdx}_${type}`;

      if (currentTool === 'breath') {
        if (!song.breaths[key]) song.breaths[key] = [];
        if (!song.breaths[key].includes(chIdx)) {
          song.breaths[key].push(chIdx);
          song.breaths[key].sort((a,b)=>a-b);
        }
      } else if (currentTool.startsWith('hl-')) {
        const color = currentTool.replace('hl-', '');
        if (!song.highlights[key]) song.highlights[key] = {};
        song.highlights[key][chIdx] = color;
      } else if (currentTool === 'eraser') {
        if (song.highlights[key]) delete song.highlights[key][chIdx];
        if (song.breaths[key]) song.breaths[key] = song.breaths[key].filter(i => i !== chIdx);
      }

      saveData();
      renderLyrics();
    }

    function removeBreath(sIdx, type, chIdx, ev) {
      ev.stopPropagation();
      const song = getActiveSong();
      const key = `${sIdx}_${type}`;
      if (song.breaths && song.breaths[key]) {
        song.breaths[key] = song.breaths[key].filter(i => i !== chIdx);
        saveData();
        renderLyrics();
      }
    }

    // 도구 선택
    function setTool(t) {
      currentTool = t;
      document.querySelectorAll('.tool-btn').forEach(btn => {
        btn.classList.toggle('active', btn.id.toLowerCase().includes(t.replace('-','')));
      });
    }

    function setViewMode(m) {
      currentViewMode = m;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', 
          (m === '3tier' && btn.innerText.includes('3단')) ||
          (m === 'furi' && btn.innerText.includes('후리가나')) ||
          (m === 'pron' && btn.innerText.includes('발음'))
        );
      });
      renderLyrics();
    }

    // 구글 드라이브 연동 (공식 /preview iframe 사용)
    function saveDriveLink() {
      const url = document.getElementById('driveUrlInput').value.trim();
      const song = getActiveSong();
      song.driveUrl = url;
      saveData();
      updateDrivePlayer(url);
    }

    function updateDrivePlayer(url) {
      const wrap = document.getElementById('drivePlayerWrap');
      const frame = document.getElementById('driveFrame');
      if (!url) {
        wrap.style.display = 'none';
        frame.src = '';
        return;
      }

      // file/d/ID/ 추출
      const match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        frame.src = `https://drive.google.com/file/d/${match[1]}/preview`;
        wrap.style.display = 'block';
      } else {
        wrap.style.display = 'none';
      }
    }

    // 로컬 파일 업로드 재생
    function loadLocalFile(input) {
      if (input.files && input.files[0]) {
        const file = input.files[0];
        const audio = document.getElementById('nativeAudio');
        audio.src = URL.createObjectURL(file);
        audio.style.display = 'block';
        audio.play();
      }
    }

    // 피치 조절
    function changePitch(delta) {
      currentPitch = Math.max(-6, Math.min(6, currentPitch + delta));
      updatePitchUI();
    }

    function resetPitch() {
      currentPitch = 0;
      updatePitchUI();
    }

    function updatePitchUI() {
      const txt = document.getElementById('pitchValText');
      if (currentPitch === 0) txt.innerText = '원키 (0)';
      else if (currentPitch > 0) txt.innerText = `+${currentPitch}키 (♯)`;
      else txt.innerText = `${currentPitch}키 (♭)`;

      const audio = document.getElementById('nativeAudio');
      if (audio && audio.src) {
        // 배속은 1.0 유지하면서 피치 효과
        const rate = Math.pow(2, currentPitch / 12);
        audio.playbackRate = rate;
      }
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', initData);
  </script>
</body>
</html>
